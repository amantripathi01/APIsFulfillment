config:
  target: "{{ $processEnvironment.API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "products_productId_put_others.csv"
    skipHeader: true
  phases:
    - duration: 60
      arrivalRate: 5
      name: "Test product update API"

scenarios:
  - name: "Update product scenario"
    flow:
      - log: "Starting product update request"
      - put:
          url: "/products/{{ productId }}"
          headers:
            Content-Type: "application/json"
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          json:
            name: "{{ name }}"
            description: "{{ description }}"
            price: "{{ price }}"
          expect:
            - statusCode: 200
            - contentType: "application/json"
      - think: 2

      - log: "Starting invalid product update request (non-existent product)"
      - put:
          url: "/products/999999"
          headers:
            Content-Type: "application/json"
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          json:
            name: "Invalid Product"
            description: "This product should not exist"
            price: 0
          expect:
            - statusCode: 404
      - think: 2

      - log: "Starting product update request with invalid data"
      - put:
          url: "/products/{{ productId }}"
          headers:
            Content-Type: "application/json"
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          json:
            name: ""
            description: "Invalid product data"
            price: "not a number"
          expect:
            - statusCode: 400
      - think: 2

      - log: "Starting product update request without authorization"
      - put:
          url: "/products/{{ productId }}"
          headers:
            Content-Type: "application/json"
          json:
            name: "Unauthorized Product"
            description: "This update should be unauthorized"
            price: 100
          expect:
            - statusCode: 401
      - think: 2
