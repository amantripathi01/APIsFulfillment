config:
  target: "{{$processEnvironment.API_HOST}}"
  phases:
    - duration: 1
      arrivalRate: 1
  payload:
    path: "products_productId_put_success.csv"
    fields:
      - "productId"
      - "name"
      - "description"
      - "price"
    skipHeader: true
    delimiter: "^|^"
  plugins:
    expect: {}

scenarios:
  - name: Update product successfully
    flow:
      - log: "Starting product update scenario"
      - put:
          url: "/products/{{productId}}"
          headers:
            Content-Type: "application/json"
            Authorization: "{{$processEnvironment.AUTH_TOKEN}}"
          json:
            name: "{{name}}"
            description: "{{description}}"
            price: "{{price}}"
          expect:
            - statusCode: 200
            - contentType: "application/json"
            - hasProperty: "id"
            - hasProperty: "name"
            - hasProperty: "description"
            - hasProperty: "price"
            - matchesJsonSchema:
                properties:
                  id:
                    type: "integer"
                    format: "int64"
                  name:
                    type: "string"
                  description:
                    type: "string"
                  price:
                    type: "integer"
                    format: "int64"
                required: ["name"]
          capture:
            - json: "$.id"
              as: "updatedProductId"
      - log: "Product update request completed. Captured updated product ID: {{ updatedProductId }}"
      - think: 2
      - log: "Verifying updated product details"
      - get:
          url: "/products/{{updatedProductId}}"
          headers:
            Authorization: "{{$processEnvironment.AUTH_TOKEN}}"
          expect:
            - statusCode: 200
            - contentType: "application/json"
            - hasProperty: "id"
            - hasProperty: "name"
            - hasProperty: "description"
            - hasProperty: "price"
            - equals: 
                - "{{ name }}"
                - "$.name"
            - equals: 
                - "{{ description }}"
                - "$.description"
            - equals: 
                - "{{ price }}"
                - "$.price"
      - log: "Product update scenario completed successfully"
