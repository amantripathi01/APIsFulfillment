config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 60
      arrivalRate: 20
  plugins:
    expect: {}
  payload:
    path: "PerformGETRequestOnQueryEndpointWithoutParameters.csv"
    fields: ["symbol", "apikey", "function"]
    skipHeader: true
    delimiter: "^|^"

scenarios:
  - name: "Perform a GET request on the /query endpoint with no parameters"
    flow:
      - get:
          url: "/query?symbol={{ symbol }}&apikey={{ apikey }}&function={{ function }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: "data"
            - hasProperty: "headers"
          capture:
            json: "$.data"
            as: "ResponseData"
      - log: "The response status code was 200 and the response contained valid data"
      - think: 1
