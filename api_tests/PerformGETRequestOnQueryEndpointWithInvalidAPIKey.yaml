config:
  target: "{{ $processEnvironment.API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "PerformGETRequestOnQueryEndpointWithInvalidAPIKey.csv"
    fields:
      - "symbol"
      - "apikey"
      - "function"
    skipHeader: true
    delimiter: "^|^"

scenarios:
  - name: "Perform a GET request on the /query endpoint with an invalid API key"
    flow:
      - get:
          url: "/query?symbol={{ symbol }}&apikey={{ apikey }}&function={{ function }}"
          expect:
            - statusCode: "!200"
            - hasProperty: "Error Message"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          capture:
            json: "$.Error Message"
            as: "ErrorMessage"
      - log: "The response status code is not 200 and the response indicates an error: {{ ErrorMessage }}"
      - think: 1
