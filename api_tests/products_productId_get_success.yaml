config:
  target: "{{$processEnvironment.API_HOST}}"
  phases:
    - duration: 10
      arrivalRate: 5
      rampTo: 20
  payload:
    path: "products_productId_get_success.csv"
    fields:
      - "productId"
    skipHeader: true
    delimiter: "^|^"
  plugins:
    expect: {}
    metrics-by-endpoint: {}
    metrics-by-scenario: {}

scenarios:
  - name: Get product by ID
    flow:
      - get:
          url: "/products/{{productId}}"
          headers:
            Content-Type: "application/json"
            Accept: "application/json"
          expect:
            - statusCode: 200
            - contentType: "application/json"
            - hasProperty: "id"
            - hasProperty: "name"
            - hasProperty: "description"
            - hasProperty: "price"
            - matchesJsonSchema:
                properties:
                  id:
                    type: "integer"
                  name:
                    type: "string"
                  description:
                    type: "string"
                  price:
                    type: "number"
                required: ["id", "name", "description", "price"]
          capture:
            - json: "$.id"
              as: "capturedProductId"
            - json: "$.name"
              as: "capturedProductName"
      - think: 2
      - log: "Retrieved product: ID={{capturedProductId}}, Name={{capturedProductName}}"
